# Testbench / Workbench configuration for ipsocode/hypervel-auditing.
#
# `workbench/` is the throwaway host application the package is tested against:
# it owns the Eloquent models, factories and migrations the suite exercises, so
# the package sees the same shape a consuming application would.

providers:
  # The package under test. Its own migrations come from this provider, behind
  # the `auditing.run_migrations` guard the suite exercises.
  - Ipsocode\Auditing\AuditingServiceProvider

# Applied to the Testbench CLI (`composer test`, testbench artisan, tinker).
# Testbench does NOT apply these to PHPUnit test methods, so phpunit.xml mirrors
# them under <php><env> — keep the two in step.
env:
  APP_NAME: "Hypervel Auditing Workbench"
  APP_ENV: testing
  # The framework's OpenTelemetry exporters find no collector in a test run. Set
  # here and not in phpunit.xml, because PHPUnit turns `true` into `1`, which the
  # SDK rejects as an invalid boolean. The Testbench commands export it to the
  # ParaTest workers.
  OTEL_SDK_DISABLED: true
  # DB_CONNECTION and DB_DATABASE are left out on purpose: the Testbench CLI lets
  # this block override the environment, so naming them would stop
  # bin/run-database-tests.sh from reaching another database. phpunit.xml
  # supplies the in-memory SQLite default, which PHPUnit applies only to
  # variables the environment has not set.
  # SQLite enforces foreign keys only when asked, and Testbench's `testing`
  # connection leaves them off by default. Without this the audit_details
  # cascade is inert under test while working on MySQL and PostgreSQL — exactly
  # the asymmetry that hides a broken constraint until production.
  DB_FOREIGN_KEYS: true
  # The package's own knobs, spelled out so config/auditing.php's env() calls are
  # visible here rather than only in the published config.
  AUDITING_ENABLED: true
  AUDITING_TABLE: audits
  AUDITING_DETAILS_TABLE: audit_details
  AUDITING_RUN_MIGRATIONS: true
  # hypervel/components ships Telescope, and discovery boots it into the
  # Workbench app. Off, or it records every query and fails at the end of each
  # test against a table the suite never migrates; phpunit.xml says more.
  TELESCOPE_ENABLED: false

# The Workbench migrations for the Testbench CLI. The suite registers them in
# tests/TestCase.php instead, early enough for RefreshDatabase's `migrate:fresh`,
# which runs before these are loaded.
migrations:
  - workbench/database/migrations

seeders:
  - Workbench\Database\Seeders\DatabaseSeeder

workbench:
  # UserResolver resolves the acting user through Auth::guard(), so the auth
  # provider is genuinely part of what this package exercises.
  auth: true
  # No HTTP surface: this package is model observers and a console command.
  health: false
  discovers:
    # `workbench/config` is intentionally empty: the package merges its own
    # config from its provider. The hook stays on so an app-level override can
    # be dropped in to reproduce a consumer's configuration without editing
    # this file again.
    config: true
    factories: true
    web: false
    api: false
    commands: true
    components: false
    views: false

purge:
  # Paths here are resolved against the runtime *skeleton*, not against
  # workbench/. package:purge-skeleton already removes the env file, the cached
  # testbench.yaml, database/database.sqlite, routes/testbench-*.php and the
  # storage app/session files on its own; these are the extras.
  files:
    - .env
  directories:
    # Hyperf's AOP proxy cache. Regenerated on the next boot, and stale proxies
    # survive a config:clear.
    - storage/framework/aop
